[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urduqa"
version = "0.1.0"
description = "Urdu extractive question answering: data preparation, paragraph-level splits and SQuAD-style evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["transformers>=4.44", "datasets>=2.20", "accelerate>=0.33", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
